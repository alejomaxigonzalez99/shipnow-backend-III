
services:
  mongodb:
    image: mongo:7
    container_name: shipnow-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: shipnow
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      target: production
    container_name: shipnow-api
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/shipnow
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRACKING_SERVICE_URL: ${TRACKING_SERVICE_URL:-}
      NOTIFICATIONS_SERVICE_URL: ${NOTIFICATIONS_SERVICE_URL:-}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mongodb_data:
